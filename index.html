<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌟 乘法大冒險！九九乘數趣味挑戰賽</title>
  <style>
    :root {
      --primary: #FF6B6B;
      --secondary: #4ECDC4;
      --accent: #FFE66D;
      --purple: #6C5CE7;
      --bg: #F7F9FC;
      --text: #2D3436;
      --card-bg: #FFFFFF;
      --shadow: 0 10px 25px rgba(0,0,0,0.08);
      --border-radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'PingFang SC', 'Microsoft JhengHei', system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text);
    }

    .game-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 680px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      padding: 35px 30px;
      position: relative;
      overflow: hidden;
      border: 4px solid #FFF;
    }

    /* 頂部常駐面板 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 3px dashed #E2E8F0;
    }

    .badge {
      background: var(--purple);
      color: white;
      padding: 8px 18px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .timer-display {
      font-size: 22px;
      font-weight: bold;
      color: var(--primary);
      background: #FFF0F0;
      padding: 6px 16px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 通用按鈕 */
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 0 #D63031;
      transition: all 0.15s ease;
      display: inline-block;
      margin-top: 15px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #D63031;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #D63031;
    }

    .btn-secondary {
      background: var(--secondary);
      box-shadow: 0 6px 0 #00A896;
    }
    .btn-secondary:hover {
      box-shadow: 0 8px 0 #00A896;
    }
    .btn-secondary:active {
      box-shadow: 0 2px 0 #00A896;
    }

    /* 視圖控制 */
    .screen {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 首頁規則卡片 */
    .hero-title {
      font-size: 32px;
      text-align: center;
      color: var(--purple);
      margin-bottom: 20px;
    }

    .rule-card {
      background: #F8F9FA;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
      border-left: 6px solid var(--secondary);
    }

    .rule-item {
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 10px;
    }

    /* 關卡輸入與題目 */
    .question-title {
      font-size: 24px;
      text-align: center;
      margin-bottom: 20px;
      color: #2D3436;
    }

    .level1-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .grid-item {
      background: #F1F2F6;
      padding: 12px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
    }

    .input-box {
      width: 65px;
      height: 45px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      border: 2px solid #CBD5E0;
      border-radius: 10px;
      margin-left: 8px;
      outline: none;
      transition: border 0.2s;
    }

    .input-box:focus {
      border-color: var(--purple);
      background: #FAF5FF;
    }

    .q-card {
      background: #F7FAFC;
      border-radius: 18px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
      border: 2px solid #EDF2F7;
    }

    .feedback-msg {
      text-align: center;
      font-size: 16px;
      min-height: 24px;
      margin-top: 10px;
      font-weight: bold;
    }
    .msg-error { color: #E53E3E; }
    .msg-success { color: #38A169; }

    /* 結果結算頁 */
    .result-box {
      text-align: center;
      padding: 20px 0;
    }
    .result-time {
      font-size: 42px;
      font-weight: 900;
      color: var(--primary);
      margin: 20px 0;
    }
    .stars {
      font-size: 40px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- 常駐計時條 (遊戲進行時顯示) -->
    <div class="top-bar" id="topBar" style="display: none;">
      <span class="badge" id="levelBadge">第 1 關</span>
      <div class="timer-display">
        ⏱️ <span id="timeCounter">00:00.0</span>
      </div>
    </div>

    <!-- 首頁 / 規則頁 -->
    <div class="screen active" id="screenHome">
      <h1 class="hero-title">🚀 九九乘數大冒險</h1>
      <div class="rule-card">
        <div class="rule-item">🎯 <strong>關卡 1：</strong> 隨機抽出一個數字，迅速完成整套乘數表！</div>
        <div class="rule-item">🔍 <strong>關卡 2：</strong> 找出隱藏乘數，共 5 題（例如：3 × ? = 15）。</div>
        <div class="rule-item">🧩 <strong>關卡 3：</strong> 破解乘積密碼，共 5 題（例如：給出 15，答出 3 × 5）。</div>
        <div class="rule-item">⚡ <strong>規則保證：</strong> 後兩關題目絕不重複，考驗你的敏捷反應！</div>
        <div class="rule-item">🛡️ <strong>貼心防護：</strong> 遊戲中誤觸重整將會有提示視窗保護進度。</div>
      </div>
      <div style="text-align: center;">
        <button class="btn" onclick="startGame()">開始挑戰 🎮</button>
      </div>
    </div>

    <!-- 第 1 關 -->
    <div class="screen" id="screenL1">
      <h2 class="question-title" id="l1Title">第 1 關：寫出所有乘數表</h2>
      <div class="level1-grid" id="l1Container"></div>
      <div class="feedback-msg" id="l1Msg"></div>
      <div style="text-align: center;">
        <button class="btn btn-secondary" onclick="checkLevel1()">提交答案 ✅</button>
      </div>
    </div>

    <!-- 第 2 關 -->
    <div class="screen" id="screenL2">
      <h2 class="question-title">第 2 關：尋找失蹤乘數 (<span id="l2Progress">1</span>/5)</h2>
      <div class="q-card" id="l2QuestionBox"></div>
      <div class="feedback-msg" id="l2Msg"></div>
      <div style="text-align: center;">
        <button class="btn btn-secondary" onclick="checkLevel2()">下一題 ➔</button>
      </div>
    </div>

    <!-- 第 3 關 -->
    <div class="screen" id="screenL3">
      <h2 class="question-title">第 3 關：數字密碼大解鎖 (<span id="l3Progress">1</span>/5)</h2>
      <div class="q-card" id="l3QuestionBox"></div>
      <div class="feedback-msg" id="l3Msg"></div>
      <div style="text-align: center;">
        <button class="btn btn-secondary" onclick="checkLevel3()">確認組合 ➔</button>
      </div>
    </div>

    <!-- 結算頁面 -->
    <div class="screen" id="screenResult">
      <div class="result-box">
        <div class="stars">🏆 🌟 🎉</div>
        <h2 style="font-size: 28px; color: var(--purple);">恭喜通關！乘法大師！</h2>
        <p style="margin-top: 10px; color: #718096;">你的總通關成績：</p>
        <div class="result-time" id="finalTime">00:00.0</div>
        <button class="btn" onclick="resetToHome()">再玩一次 🔄</button>
      </div>
    </div>
  </div>

  <script>
    // 遊戲狀態全域變數
    let isPlaying = false;
    let timerInterval = null;
    let startTime = null;

    let l1Target = 2;
    let l2Questions = [];
    let l2Index = 0;
    let l3Questions = [];
    let l3Index = 0;

    // 攔截重新整理與關閉頁面 (防止誤觸 F5/Refresh)
    window.addEventListener('beforeunload', function (e) {
      if (isPlaying) {
        e.preventDefault();
        e.returnValue = '遊戲仍在進行中，確認要重新載入並放棄當前進度嗎？';
        return e.returnValue;
      }
    });

    // 計時器邏輯
    function startTimer() {
      startTime = Date.now();
      timerInterval = setInterval(() => {
        const diff = Date.now() - startTime;
        const totalSeconds = Math.floor(diff / 1000);
        const ms = Math.floor((diff % 1000) / 100);
        const mins = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const secs = String(totalSeconds % 60).padStart(2, '0');
        document.getElementById('timeCounter').textContent = `${mins}:${secs}.${ms}`;
      }, 100);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      const diff = Date.now() - startTime;
      const totalSeconds = Math.floor(diff / 1000);
      const ms = Math.floor((diff % 1000) / 100);
      const mins = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
      const secs = String(totalSeconds % 60).padStart(2, '0');
      return `${mins}分 ${secs}.${ms}秒`;
    }

    // 切換畫面工具函式
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    // 開始遊戲
    function startGame() {
      isPlaying = true;
      document.getElementById('topBar').style.display = 'flex';
      startTimer();
      generateAllQuestions();
      setupLevel1();
    }

    // 預先生成題目並確保第 2、3 關絕不重複
    function generateAllQuestions() {
      // 第 1 關抽數字 (2 - 9)
      l1Target = Math.floor(Math.random() * 8) + 2;

      // 生成所有可能的九九乘法組合 (2~9)
      const allPairs = [];
      for (let a = 2; a <= 9; a++) {
        for (let b = 2; b <= 9; b++) {
          allPairs.push({ a, b, product: a * b });
        }
      }
      // 洗牌
      allPairs.sort(() => Math.random() - 0.5);

      // 第 2 關抽 5 題
      l2Questions = [];
      const usedProducts = new Set();
      
      for (let i = 0; l2Questions.length < 5 && i < allPairs.length; i++) {
        const pair = allPairs[i];
        if (!usedProducts.has(pair.product)) {
          usedProducts.add(pair.product);
          // 隨機缺項在乘數或被乘數
          const missingFirst = Math.random() > 0.5;
          l2Questions.push({
            numA: pair.a,
            numB: pair.b,
            product: pair.product,
            missingFirst: missingFirst,
            answer: missingFirst ? pair.a : pair.b
          });
        }
      }

      // 第 3 關抽 5 個不同的積，且絕不與第 2 關出現過的乘積重複
      l3Questions = [];
      for (let i = 0; l3Questions.length < 5 && i < allPairs.length; i++) {
        const pair = allPairs[i];
        if (!usedProducts.has(pair.product)) {
          usedProducts.add(pair.product);
          l3Questions.push(pair.product);
        }
      }

      l2Index = 0;
      l3Index = 0;
    }

    // 關卡 1 初始化與檢查
    function setupLevel1() {
      document.getElementById('levelBadge').textContent = '第 1 關';
      document.getElementById('l1Title').textContent = `第 1 關：請寫出【${l1Target}】的所有乘數表`;
      const container = document.getElementById('l1Container');
      container.innerHTML = '';
      document.getElementById('l1Msg').textContent = '';

      for (let i = 1; i <= 9; i++) {
        const item = document.createElement('div');
        item.className = 'grid-item';
        item.innerHTML = `${l1Target} × ${i} = <input type="number" class="input-box l1-input" data-ans="${l1Target * i}">`;
        container.appendChild(item);
      }
      showScreen('screenL1');
    }

    function checkLevel1() {
      const inputs = document.querySelectorAll('.l1-input');
      let allCorrect = true;

      inputs.forEach(input => {
        const userVal = parseInt(input.value.trim(), 10);
        const correctVal = parseInt(input.dataset.ans, 10);
        if (userVal !== correctVal) {
          allCorrect = false;
          input.style.borderColor = '#E53E3E';
        } else {
          input.style.borderColor = '#38A169';
        }
      });

      const msg = document.getElementById('l1Msg');
      if (allCorrect) {
        msg.className = 'feedback-msg msg-success';
        msg.textContent = '🌟 太厲害了！全部正確，即將進入第 2 關...';
        setTimeout(() => {
          setupLevel2();
        }, 1200);
      } else {
        msg.className = 'feedback-msg msg-error';
        msg.textContent = '有部分答案不正確或未填寫，再檢查一下喔！';
      }
    }

    // 關卡 2 初始化與檢查
    function setupLevel2() {
      document.getElementById('levelBadge').textContent = '第 2 關';
      showScreen('screenL2');
      renderLevel2Question();
    }

    function renderLevel2Question() {
      const q = l2Questions[l2Index];
      document.getElementById('l2Progress').textContent = l2Index + 1;
      document.getElementById('l2Msg').textContent = '';
      
      const box = document.getElementById('l2QuestionBox');
      if (q.missingFirst) {
        box.innerHTML = `<input type="number" id="l2Input" class="input-box" autofocus> × ${q.numB} = ${q.product}`;
      } else {
        box.innerHTML = `${q.numA} × <input type="number" id="l2Input" class="input-box" autofocus> = ${q.product}`;
      }
    }

    function checkLevel2() {
      const input = document.getElementById('l2Input');
      const userVal = parseInt(input.value.trim(), 10);
      const q = l2Questions[l2Index];
      const msg = document.getElementById('l2Msg');

      if (userVal === q.answer) {
        l2Index++;
        if (l2Index < l2Questions.length) {
          renderLevel2Question();
        } else {
          msg.className = 'feedback-msg msg-success';
          msg.textContent = '🎉 第 2 關全數過關！前進最終關卡...';
          setTimeout(() => {
            setupLevel3();
          }, 1200);
        }
      } else {
        msg.className = 'feedback-msg msg-error';
        msg.textContent = '答案不對喔，再想想看！';
        input.focus();
      }
    }

    // 關卡 3 初始化與檢查
    function setupLevel3() {
      document.getElementById('levelBadge').textContent = '第 3 關';
      showScreen('screenL3');
      renderLevel3Question();
    }

    function renderLevel3Question() {
      const targetProduct = l3Questions[l3Index];
      document.getElementById('l3Progress').textContent = l3Index + 1;
      document.getElementById('l3Msg').textContent = '';
      
      const box = document.getElementById('l3QuestionBox');
      box.innerHTML = `
        <span style="color: var(--purple); margin-right: 15px;">目標積數：${targetProduct}</span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <input type="number" id="l3FactorA" class="input-box" min="1" max="9">
          <span>×</span>
          <input type="number" id="l3FactorB" class="input-box" min="1" max="9">
        </div>
      `;
    }

    function checkLevel3() {
      const fa = parseInt(document.getElementById('l3FactorA').value.trim(), 10);
      const fb = parseInt(document.getElementById('l3FactorB').value.trim(), 10);
      const targetProduct = l3Questions[l3Index];
      const msg = document.getElementById('l3Msg');

      // 檢查是否為 1~9 的乘數且相乘等於目標
      if (fa >= 1 && fa <= 9 && fb >= 1 && fb <= 9 && (fa * fb === targetProduct)) {
        l3Index++;
        if (l3Index < l3Questions.length) {
          renderLevel3Question();
        } else {
          finishGame();
        }
      } else {
        msg.className = 'feedback-msg msg-error';
        msg.textContent = '組合不正確或數字超出 1~9 範圍，請重新調整！';
      }
    }

    // 完成遊戲結算
    function finishGame() {
      isPlaying = false; // 解除防離開限制
      const finalTimeString = stopTimer();
      document.getElementById('topBar').style.display = 'none';
      document.getElementById('finalTime').textContent = finalTimeString;
      showScreen('screenResult');
    }

    // 重設回首頁
    function resetToHome() {
      showScreen('screenHome');
      document.getElementById('topBar').style.display = 'none';
      document.getElementById('timeCounter').textContent = '00:00.0';
    }
  </script>
</body>
</html>
